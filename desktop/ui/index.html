<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; media-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'">
  <title>SimpleTube</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg class="defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="3"/><path d="m15 10 5-3v10l-5-3"/></symbol>
      <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 17V6l11-2v11M9 9l11-2"/><ellipse cx="6" cy="18" rx="3" ry="2.5"/><ellipse cx="17" cy="16" rx="3" ry="2.5"/></symbol>
      <symbol id="i-both" viewBox="0 0 28 24"><rect x="2" y="5" width="13" height="13" rx="3"/><path d="m7 9 5 3-5 3zM21 16V6l5-1"/><ellipse cx="18.5" cy="17.5" rx="2.5" ry="2"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3.2-3.2a4.5 4.5 0 0 0-6.4-6.4l-1 1M14 10a4.5 4.5 0 0 0-6.4 0l-3.2 3.2a4.5 4.5 0 0 0 6.4 6.4l1-1"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 8V6a2 2 0 0 1 2-2h5l3 3h6a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8h18"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    </defs>
  </svg>
  <!-- Refraction map for the liquid-glass panel; the image is generated in renderer.js to match the panel size. -->
  <svg class="defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <filter id="refract" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse">
      <feImage id="refractMap" x="0" y="0" result="map" preserveAspectRatio="none"/>
      <feDisplacementMap in="SourceGraphic" in2="map" scale="46" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <main class="shell" id="shell">
    <div class="intro" id="intro" aria-hidden="true"><div class="glow" id="glow"></div><div class="grain"></div></div>
    <div class="cover" id="cover" aria-hidden="true"><img id="coverImage" alt=""></div>

    <header class="titlebar">
      <span class="brand">simpletube<span class="brand-dot">.</span></span>
      <div class="window-controls">
        <button id="minimize" class="window-dot minimize" aria-label="Minimize" title="Minimize"></button>
        <button id="close" class="window-dot close" aria-label="Close" title="Close"></button>
      </div>
    </header>

    <section class="stage">
      <h1 class="headline" id="headline">Download for Yourself</h1>
      <div class="ring" id="ring" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Download progress" hidden>
        <div class="ring-track"></div>
        <div class="ring-fill"></div>
        <span class="ring-label" id="percent">0%</span>
        <svg class="ring-check"><use href="#i-check"/></svg>
      </div>
    </section>

    <section class="panel" id="panel">
      <div class="clip" id="clip">
        <div class="clip-inner">
          <p class="video-title" id="videoTitle"></p>
          <div class="time-row">
            <label class="field time-field"><span>From</span><input id="start" aria-label="Clip start" value="00:00:00" maxlength="9" inputmode="numeric" spellcheck="false"></label>
            <span class="time-dash"></span>
            <label class="field time-field"><span>To</span><input id="end" aria-label="Clip end" value="00:00:00" maxlength="9" inputmode="numeric" spellcheck="false"></label>
          </div>
          <div class="range" id="range">
            <div class="range-track"></div>
            <div class="range-fill" id="rangeFill"></div>
            <button class="range-thumb" id="thumbStart" role="slider" aria-label="Clip start"></button>
            <button class="range-thumb" id="thumbEnd" role="slider" aria-label="Clip end"></button>
          </div>
          <div class="range-meta"><span id="rangeSummary"></span><button id="resetRange" class="text-button" hidden>Use full video</button></div>
        </div>
      </div>

      <div class="input-row">
        <label class="field input-field"><svg><use href="#i-link"/></svg><input id="url" aria-label="YouTube link" placeholder="YouTube link" spellcheck="false" autocomplete="off"></label>
        <button id="paste" class="field-button">Paste</button>
      </div>
      <div class="input-row">
        <label class="field input-field"><svg><use href="#i-folder"/></svg><input id="folder" aria-label="Save folder" placeholder="Save to" spellcheck="false" autocomplete="off"></label>
        <button id="chooseFolder" class="field-button">Folder</button>
      </div>

      <div class="modes" role="radiogroup" aria-label="What to download">
        <button class="mode selected" data-mode="full" role="radio" aria-checked="true" aria-label="Video and audio"><svg class="wide"><use href="#i-both"/></svg><span class="tooltip">Video + audio</span></button>
        <button class="mode" data-mode="video" role="radio" aria-checked="false" aria-label="Video only" tabindex="-1"><svg><use href="#i-video"/></svg><span class="tooltip">Video only</span></button>
        <button class="mode" data-mode="audio" role="radio" aria-checked="false" aria-label="Audio only" tabindex="-1"><svg><use href="#i-music"/></svg><span class="tooltip">Audio only</span></button>
      </div>

      <div class="actions">
        <button id="download" class="primary" disabled><svg><use href="#i-download"/></svg><span>Download</span></button>
        <button id="cancel" class="secondary" disabled>Cancel</button>
      </div>
      <div class="error-slot" id="errorSlot"><p class="error" id="error" role="alert"></p></div>
    </section>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
